<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lanmap - LAN Host Manager & Security Detector</title>
    <script src="/static/htmx.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#64748b',
                        danger: '#dc2626',
                        success: '#16a34a',
                        warning: '#d97706',
                    }
                }
            }
        }
    </script>
    <script>
        // Default is light theme, toggleable to dark
        function initTheme() {
            const saved = localStorage.getItem('lanmap-theme');
            if (saved === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('lanmap-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('lanmap-theme', 'dark');
            }
        }
        initTheme();
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="h-full flex overflow-hidden font-sans antialiased text-sm bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-150">

    <!-- Left Sidebar -->
    <aside id="sidebar-container" class="w-64 flex-shrink-0 bg-white border-r border-slate-200 dark:bg-slate-950 dark:border-slate-800 flex flex-col justify-between"
           hx-get="/partials/sidebar" hx-trigger="load, refreshSidebar from:body" hx-swap="outerHTML">
        <div class="p-4 text-center text-slate-400">Loading sidebar...</div>
    </aside>

    <!-- Right Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-slate-50 dark:bg-slate-900 overflow-hidden">
        <!-- Main Content (Table) -->
        <div id="main-content" class="flex-1 overflow-y-auto p-6"
             hx-get="/partials/main_table" hx-trigger="load, refreshMainTable from:body" hx-swap="outerHTML">
            <div class="flex items-center justify-center h-64 text-slate-400">
                <svg class="animate-spin h-6 w-6 mr-3 text-blue-500" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                読み込み中...
            </div>
        </div>
    </main>

    <!-- Global Modal Container -->
    <div id="modal-container"></div>

    <script>
        function closeModal() {
            const container = document.getElementById('modal-container');
            if (container) container.innerHTML = '';
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
