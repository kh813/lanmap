<aside id="sidebar-container" class="w-64 flex-shrink-0 bg-white border-r border-slate-200 dark:bg-slate-950 dark:border-slate-800 flex flex-col justify-between select-none"
       hx-get="/partials/sidebar?segment_id={{.SelectedSegmentID}}"
       hx-trigger="every 30s, refreshSidebar from:body"
       hx-swap="outerHTML">
    <div class="flex flex-col flex-1 overflow-y-auto">
        <!-- Logo Header -->
        <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 text-white font-black px-2 py-1 rounded text-xs tracking-wider shadow">LMAP</div>
                <span class="font-bold text-base tracking-tight text-slate-900 dark:text-white">lanmap</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <!-- Theme Switch Button -->
                <button type="button" onclick="toggleTheme()" title="テーマ切替 (ライト/ダーク)"
                        class="p-1 rounded text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <span class="dark:hidden">🌙</span>
                    <span class="hidden dark:inline">☀️</span>
                </button>
                <span class="text-[11px] px-1.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700">v0.0.2</span>
            </div>
        </div>

        <!-- Segments Header -->
        <div class="px-4 pt-4 pb-2 flex items-center justify-between text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
            <span>セグメント一覧</span>
            <button hx-get="/modals/segment" hx-target="#modal-container" hx-swap="innerHTML"
                    class="text-blue-600 dark:text-blue-400 hover:underline font-normal normal-case flex items-center text-xs">
                + 追加
            </button>
        </div>

        <!-- Segment Navigation Links -->
        <nav class="flex-1 px-2 space-y-1">
            <!-- All Hosts -->
            <a hx-get="/partials/main_table?segment_id=" hx-target="#main-content" hx-swap="outerHTML"
               hx-push-url="false"
               class="flex items-center justify-between px-3 py-2 text-sm font-medium rounded-md transition-colors cursor-pointer {{if not .SelectedSegmentID}}bg-blue-50 text-blue-700 border border-blue-200 dark:bg-blue-600/20 dark:text-blue-400 dark:border-blue-500/30{{else}}text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-900 dark:hover:text-white{{end}}">
                <div class="flex items-center space-x-2 truncate">
                    <span>🌐</span>
                    <span class="truncate">すべてのホスト</span>
                </div>
                <span class="text-xs text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800/80 px-1.5 py-0.5 rounded border border-slate-200 dark:border-transparent">{{.TotalHostsCount}}</span>
            </a>

            <!-- Segment items -->
            {{range .Segments}}
            <div class="group flex items-center justify-between px-3 py-2 text-sm font-medium rounded-md transition-colors cursor-pointer {{if eq $.SelectedSegmentID .ID}}bg-blue-50 text-blue-700 border border-blue-200 dark:bg-blue-600/20 dark:text-blue-400 dark:border-blue-500/30{{else}}text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-900 dark:hover:text-white{{end}}">
                <div hx-get="/partials/main_table?segment_id={{.ID}}" hx-target="#main-content" hx-swap="outerHTML"
                     class="flex-1 flex flex-col min-w-0 pr-1">
                    <div class="flex items-center space-x-2">
                        <span>{{if .IsDefault}}📁{{else}}🏢{{end}}</span>
                        <span class="truncate font-medium">{{.Name}}</span>
                    </div>
                    {{if .CIDR}}
                    <span class="text-[11px] text-slate-500 dark:text-slate-400 truncate pl-6 font-mono">{{.CIDR}}</span>
                    {{end}}
                </div>
                {{if not .IsDefault}}
                <div class="opacity-0 group-hover:opacity-100 flex items-center space-x-1">
                    <button hx-get="/modals/segment?id={{.ID}}" hx-target="#modal-container" hx-swap="innerHTML"
                            title="編集" class="p-1 text-slate-400 hover:text-blue-600 dark:hover:text-blue-400">
                        ✏️
                    </button>
                    <button hx-delete="/api/segments/{{.ID}}" hx-confirm="セグメント「{{.Name}}」を削除しますか？ 所属ホストは未分類に移動します。"
                            hx-target="#sidebar-container" hx-swap="outerHTML"
                            title="削除" class="p-1 text-slate-400 hover:text-red-600 dark:hover:text-red-400">
                        🗑️
                    </button>
                </div>
                {{end}}
            </div>
            {{end}}
        </nav>

        <!-- Quick Actions -->
        <div class="p-3 border-t border-slate-200 dark:border-slate-800/80 space-y-2">
            <button hx-get="/modals/whitelist" hx-target="#modal-container" hx-swap="innerHTML"
                    class="w-full flex items-center justify-center space-x-1.5 py-1.5 px-3 rounded-md bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/40 dark:hover:bg-emerald-900/60 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800/60 text-xs font-semibold transition shadow-sm">
                <span>📋</span>
                <span>台帳ホワイトリスト登録</span>
            </button>

            <button hx-get="/modals/add_host" hx-target="#modal-container" hx-swap="innerHTML"
                    class="w-full flex items-center justify-center space-x-1.5 py-1.5 px-3 rounded-md bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 text-xs font-medium transition shadow-sm">
                <span>➕</span>
                <span>ホストを手動追加</span>
            </button>
        </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="p-3 border-t border-slate-200 dark:border-slate-800 bg-slate-100/60 dark:bg-slate-950">
        <button hx-get="/modals/settings" hx-target="#modal-container" hx-swap="innerHTML"
                class="w-full flex items-center justify-between px-3 py-2 rounded-lg bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 hover:border-blue-500 hover:text-blue-600 dark:hover:text-blue-400 border border-slate-300 dark:border-slate-700 shadow-sm transition group">
            <div class="flex items-center space-x-2">
                <span class="p-1 rounded-md bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 group-hover:scale-110 transition-transform">⚙️</span>
                <span class="font-semibold text-xs">設定画面</span>
            </div>
            <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium border border-slate-200 dark:border-slate-700">
                {{.KumaStatus}}
            </span>
        </button>
    </div>
</aside>
