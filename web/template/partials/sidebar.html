<aside id="sidebar-container" class="w-64 flex-shrink-0 bg-slate-950 border-r border-slate-800 flex flex-col justify-between select-none">
    <div class="flex flex-col flex-1 overflow-y-auto">
        <!-- Logo Header -->
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 text-white font-black px-2 py-1 rounded text-xs tracking-wider shadow">LMAP</div>
                <span class="font-bold text-base tracking-tight text-white">lanmap</span>
            </div>
            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">v1.0.0</span>
        </div>

        <!-- Segments Header -->
        <div class="px-4 pt-4 pb-2 flex items-center justify-between text-xs font-semibold text-slate-400 uppercase tracking-wider">
            <span>セグメント一覧</span>
            <button hx-get="/modals/segment" hx-target="#modal-container" hx-swap="innerHTML"
                    class="text-blue-400 hover:text-blue-300 font-normal normal-case flex items-center text-xs">
                + 追加
            </button>
        </div>

        <!-- Segment Navigation Links -->
        <nav class="flex-1 px-2 space-y-1">
            <!-- All Hosts -->
            <a hx-get="/partials/main_table?segment_id=" hx-target="#main-content" hx-swap="outerHTML"
               hx-push-url="false"
               class="flex items-center justify-between px-3 py-2 text-sm font-medium rounded-md transition-colors cursor-pointer {{if not .SelectedSegmentID}}bg-blue-600/20 text-blue-400 border border-blue-500/30{{else}}text-slate-300 hover:bg-slate-900 hover:text-white{{end}}">
                <div class="flex items-center space-x-2 truncate">
                    <span>🌐</span>
                    <span class="truncate">すべてのホスト</span>
                </div>
                <span class="text-xs text-slate-400 bg-slate-800/80 px-1.5 py-0.5 rounded">{{.TotalHostsCount}}</span>
            </a>

            <!-- Segment items -->
            {{range .Segments}}
            <div class="group flex items-center justify-between px-3 py-2 text-sm font-medium rounded-md transition-colors cursor-pointer {{if eq $.SelectedSegmentID .ID}}bg-blue-600/20 text-blue-400 border border-blue-500/30{{else}}text-slate-300 hover:bg-slate-900 hover:text-white{{end}}">
                <div hx-get="/partials/main_table?segment_id={{.ID}}" hx-target="#main-content" hx-swap="outerHTML"
                     class="flex-1 flex flex-col min-w-0 pr-1">
                    <div class="flex items-center space-x-2">
                        <span>{{if .IsDefault}}📁{{else}}🏢{{end}}</span>
                        <span class="truncate font-medium">{{.Name}}</span>
                    </div>
                    {{if .CIDR}}
                    <span class="text-[11px] text-slate-500 truncate pl-6 font-mono">{{.CIDR}}</span>
                    {{end}}
                </div>
                {{if not .IsDefault}}
                <div class="opacity-0 group-hover:opacity-100 flex items-center space-x-1">
                    <button hx-get="/modals/segment?id={{.ID}}" hx-target="#modal-container" hx-swap="innerHTML"
                            title="編集" class="p-1 text-slate-400 hover:text-blue-400">
                        ✏️
                    </button>
                    <button hx-delete="/api/segments/{{.ID}}" hx-confirm="セグメント「{{.Name}}」を削除しますか？ 所属ホストは未分類に移動します。"
                            hx-target="#sidebar-container" hx-swap="outerHTML"
                            title="削除" class="p-1 text-slate-400 hover:text-red-400">
                        🗑️
                    </button>
                </div>
                {{end}}
            </div>
            {{end}}
        </nav>

        <!-- Quick Actions -->
        <div class="p-3 border-t border-slate-800/80 space-y-2">
            <button hx-get="/modals/add_host" hx-target="#modal-container" hx-swap="innerHTML"
                    class="w-full flex items-center justify-center space-x-1.5 py-1.5 px-3 rounded-md bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 text-xs font-medium transition shadow-sm">
                <span>➕</span>
                <span>ホストを手動追加</span>
            </button>
        </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="p-3 border-t border-slate-800 bg-slate-950/80">
        <button hx-get="/modals/settings" hx-target="#modal-container" hx-swap="innerHTML"
                class="w-full flex items-center justify-between px-3 py-2 rounded-md text-slate-300 hover:bg-slate-900 hover:text-white transition text-xs">
            <div class="flex items-center space-x-2">
                <span>⚙️</span>
                <span class="font-medium">設定画面</span>
            </div>
            <span class="text-[11px] text-slate-400">{{.KumaStatus}}</span>
        </button>
    </div>
</aside>
