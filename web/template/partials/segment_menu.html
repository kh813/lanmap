<!-- Invisible Backdrop to close menu on outside click -->
<div class="fixed inset-0 z-40 bg-transparent" onclick="this.parentElement.innerHTML = ''"></div>

<div class="absolute right-2 top-full mt-1 w-56 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl py-1.5 z-50 text-left text-xs divide-y divide-slate-100 dark:divide-slate-800 animate-fade-in">
    <!-- Toggle Scan Target -->
    <div class="py-1">
        {{if not .Segment.IsEnabled}}
        <button hx-post="/api/segments/{{.Segment.ID}}/toggle" hx-target="#sidebar-container" hx-swap="outerHTML"
                onclick="event.stopPropagation()"
                class="w-full text-left px-3 py-1.5 hover:bg-emerald-50 dark:hover:bg-emerald-950/50 flex items-center space-x-2 text-emerald-600 dark:text-emerald-400 font-medium">
            <span>{{t $.Lang "seg_menu_enable"}}</span>
        </button>
        {{else}}
        <button hx-post="/api/segments/{{.Segment.ID}}/toggle" hx-target="#sidebar-container" hx-swap="outerHTML"
                onclick="event.stopPropagation()"
                class="w-full text-left px-3 py-1.5 hover:bg-amber-50 dark:hover:bg-amber-950/50 flex items-center space-x-2 text-amber-600 dark:text-amber-400 font-medium">
            <span>{{t $.Lang "seg_menu_disable"}}</span>
        </button>
        {{end}}
    </div>

    <!-- Edit Details -->
    <div class="py-1">
        <button hx-get="/modals/segment?id={{.Segment.ID}}" hx-target="#modal-container" hx-swap="innerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-2 text-slate-700 dark:text-slate-300">
            <span>{{t $.Lang "seg_menu_edit"}}</span>
        </button>
    </div>

    <!-- Delete (Non-default only) -->
    {{if not .Segment.IsDefault}}
    <div class="py-1">
        <button hx-delete="/api/segments/{{.Segment.ID}}" hx-confirm="Delete segment {{.Segment.Name}}?"
                hx-target="#sidebar-container" hx-swap="outerHTML"
                onclick="event.stopPropagation()"
                class="w-full text-left px-3 py-1.5 hover:bg-red-50 dark:hover:bg-red-950/60 flex items-center space-x-2 text-red-600 dark:text-red-400">
            <span>{{t $.Lang "seg_menu_delete"}}</span>
        </button>
    </div>
    {{end}}
</div>
