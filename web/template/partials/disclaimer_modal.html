<div class="fixed inset-0 bg-black/60 dark:bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in" onclick="if(event.target===this) closeModal()">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 text-slate-800 dark:text-slate-100">
        <!-- Header -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
            <h2 class="text-base font-bold text-slate-900 dark:text-white flex items-center space-x-2">
                <span>{{t .Lang "disclaimer_title"}}</span>
            </h2>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-lg">&times;</button>
        </div>

        <!-- Warning Lead Box -->
        <div class="p-4 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-700/60 flex items-start space-x-3">
            <span class="text-xl flex-shrink-0">⚠️</span>
            <div class="text-xs leading-relaxed font-bold text-amber-900 dark:text-amber-200">
                {{t .Lang "disclaimer_lead"}}
            </div>
        </div>

        <!-- Body Details -->
        <div class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed space-y-2.5 whitespace-pre-line bg-slate-50 dark:bg-slate-950/60 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
            {{t .Lang "disclaimer_body"}}
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-200 dark:border-slate-800">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-medium transition">
                {{t .Lang "disclaimer_btn_close"}}
            </button>
            <button type="button"
                    onclick="agreeDisclaimer()"
                    class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-md hover:shadow-lg transition flex items-center space-x-1.5">
                <span>✓</span>
                <span>{{t .Lang "disclaimer_btn_agree"}}</span>
            </button>
        </div>
    </div>
</div>
<script>
    function agreeDisclaimer() {
        try { localStorage.setItem('lanmap_disclaimer_agreed', 'true'); } catch(e){}
        fetch('/api/disclaimer/agree', { method: 'POST' });
        closeModal();
    }
    // If client already agreed in localStorage, dismiss immediately and sync server
    try {
        if (localStorage.getItem('lanmap_disclaimer_agreed') === 'true') {
            fetch('/api/disclaimer/agree', { method: 'POST' });
            closeModal();
        }
    } catch(e){}
</script>
