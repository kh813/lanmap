<div class="fixed inset-0 bg-black/60 dark:bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-[60] overflow-y-auto animate-fade-in" onclick="if(event.target===this) closeSubmodal()">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl max-w-md w-full p-5 shadow-2xl space-y-4 my-6 text-slate-800 dark:text-slate-100">
        <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
            <h3 class="text-sm font-bold text-slate-900 dark:text-white">
                {{if .Port.ID}}{{t .Lang "ports_modal_edit_title"}}{{else}}{{t .Lang "ports_modal_add_title"}}{{end}}
            </h3>
            <button type="button" onclick="closeSubmodal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-lg">&times;</button>
        </div>

        <form {{if .Port.ID}}hx-post="/api/ports/{{.Port.ID}}/update"{{else}}hx-post="/api/ports"{{end}}
              hx-target="#custom-ports-container"
              hx-swap="innerHTML"
              onsubmit="setTimeout(() => { closeSubmodal(); }, 150)"
              class="space-y-3 text-xs">

            <!-- Profile Selection -->
            <div>
                <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    {{t .Lang "ports_modal_profile_label"}} *
                </label>
                <select name="profile_id" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-2.5 py-1.5 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-blue-500">
                    <option value="all" {{if eq .Port.ProfileID "all"}}selected{{end}}>🌐 {{t .Lang "profile_all"}}</option>
                    <option value="apple_mac" {{if eq .Port.ProfileID "apple_mac"}}selected{{end}}>🍎 {{t .Lang "profile_apple_mac"}}</option>
                    <option value="windows" {{if eq .Port.ProfileID "windows"}}selected{{end}}>🪟 {{t .Lang "profile_windows"}}</option>
                    <option value="nas_linux" {{if eq .Port.ProfileID "nas_linux"}}selected{{end}}>🐧 {{t .Lang "profile_nas_linux"}}</option>
                    <option value="printer" {{if eq .Port.ProfileID "printer"}}selected{{end}}>🖨️ {{t .Lang "profile_printer"}}</option>
                    <option value="network" {{if eq .Port.ProfileID "network"}}selected{{end}}>🌐 {{t .Lang "profile_network"}}</option>
                    <option value="media_iot" {{if eq .Port.ProfileID "media_iot"}}selected{{end}}>📺 {{t .Lang "profile_media_iot"}}</option>
                    <option value="generic" {{if eq .Port.ProfileID "generic"}}selected{{end}}>💻 {{t .Lang "profile_generic"}}</option>
                </select>
            </div>

            <!-- Protocol & Port Row -->
            <div class="grid grid-cols-3 gap-2">
                <div>
                    <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        {{t .Lang "ports_modal_proto_label"}}
                    </label>
                    <select name="protocol" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-2.5 py-1.5 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="TCP" {{if or (eq .Port.Protocol "TCP") (not .Port.Protocol)}}selected{{end}}>TCP</option>
                        <option value="UDP" {{if eq .Port.Protocol "UDP"}}selected{{end}}>UDP</option>
                    </select>
                </div>
                <div class="col-span-2">
                    <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        {{t .Lang "ports_modal_port_label"}} *
                    </label>
                    <input type="number" name="port" min="1" max="65535" value="{{if .Port.Port}}{{.Port.Port}}{{end}}" required
                           placeholder="8080"
                           class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-2.5 py-1.5 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-blue-500 font-mono">
                </div>
            </div>

            <!-- Service / Protocol Name -->
            <div>
                <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    {{t .Lang "ports_modal_name_label"}} *
                </label>
                <input type="text" name="protocol_name" value="{{.Port.ProtocolName}}" required
                       placeholder="{{t .Lang "ports_modal_name_ph"}}"
                       class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-2.5 py-1.5 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-blue-500">
            </div>

            <!-- Severity / Risk Level -->
            <div>
                <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    {{t .Lang "ports_modal_severity_label"}}
                </label>
                <select name="severity" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-2.5 py-1.5 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-blue-500">
                    <option value="info" {{if or (eq .Port.Severity "info") (not .Port.Severity)}}selected{{end}}>{{t .Lang "ports_severity_info"}}</option>
                    <option value="warning" {{if eq .Port.Severity "warning"}}selected{{end}}>{{t .Lang "ports_severity_warning"}}</option>
                    <option value="danger" {{if eq .Port.Severity "danger"}}selected{{end}}>{{t .Lang "ports_severity_danger"}}</option>
                </select>
            </div>

            <!-- Description -->
            <div>
                <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    {{t .Lang "ports_modal_desc_label"}}
                </label>
                <input type="text" name="description" value="{{.Port.Description}}"
                       placeholder="{{t .Lang "ports_modal_desc_ph"}}"
                       class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-2.5 py-1.5 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-blue-500">
            </div>

            <!-- Enabled checkbox -->
            <div class="pt-1">
                <label class="flex items-center space-x-2 cursor-pointer select-none">
                    <input type="checkbox" name="is_enabled" value="1"
                           {{if or .Port.IsEnabled (not .Port.ID)}}checked{{end}}
                           class="rounded text-blue-600 focus:ring-blue-500">
                    <span class="text-slate-700 dark:text-slate-300">{{t .Lang "ports_modal_enabled_chk"}}</span>
                </label>
            </div>

            <!-- Buttons -->
            <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-200 dark:border-slate-800">
                <button type="button" onclick="closeSubmodal()"
                        class="px-3.5 py-1.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium transition text-xs">
                    {{t .Lang "cancel"}}
                </button>
                <button type="submit"
                        class="px-4 py-1.5 rounded bg-blue-600 hover:bg-blue-500 text-white font-medium transition shadow text-xs">
                    {{t .Lang "ports_modal_save_btn"}}
                </button>
            </div>
        </form>
    </div>
</div>
