<div class="fixed inset-0 bg-black/60 dark:bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-[60] overflow-y-auto animate-fade-in" onclick="if(event.target===this) this.remove()">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl max-w-lg w-full p-5 shadow-2xl space-y-4 my-6 text-slate-800 dark:text-slate-100">
        <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
            <h3 class="text-sm font-bold text-slate-900 dark:text-white">
                {{t .Lang "ports_import_modal_title"}}
            </h3>
            <button onclick="this.closest('.fixed').remove()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-lg">&times;</button>
        </div>

        <div class="bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-900/60 rounded p-2.5 text-[11px] text-blue-800 dark:text-blue-300">
            <p class="font-semibold">{{t .Lang "ports_import_format_hint"}}</p>
            <p class="mt-0.5 text-blue-600 dark:text-blue-400">{{t .Lang "ports_import_note"}}</p>
        </div>

        <form hx-post="/api/ports/import"
              hx-target="#custom-ports-container"
              hx-swap="innerHTML"
              onsubmit="setTimeout(() => { const m = this.closest('.fixed'); if(m) m.remove(); }, 100)"
              class="space-y-3 text-xs">

            <!-- File selection or Text area -->
            <div>
                <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    CSV Text / File Content
                </label>
                <textarea id="import-csv-text" name="csv_data" rows="8" required
                          placeholder="TargetOS,Protocol,Port,ProtocolName,Description,Enabled
apple_mac,TCP,8080,HTTP-Alt,Local web server,true
windows,TCP,5985,WinRM,Remote management,true"
                          class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-2.5 py-1.5 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-blue-500 font-mono text-[11px]"></textarea>
            </div>

            <div>
                <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Or select a local CSV file:
                </label>
                <input type="file" accept=".csv,text/csv" onchange="const f = this.files[0]; if(f){ const r = new FileReader(); r.onload = (e) => document.getElementById('import-csv-text').value = e.target.result; r.readAsText(f); }"
                       class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border file:border-slate-300 dark:file:border-slate-700 file:text-xs file:bg-white dark:file:bg-slate-800 file:text-slate-700 dark:file:text-slate-300 hover:file:bg-slate-100 cursor-pointer">
            </div>

            <!-- Import Mode Selection -->
            <div class="space-y-1.5 pt-1">
                <span class="block font-semibold text-slate-700 dark:text-slate-300">Import Mode:</span>
                <div class="space-y-1">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="replace" value="false" checked class="text-blue-600 focus:ring-blue-500">
                        <span class="text-slate-700 dark:text-slate-300">{{t .Lang "ports_import_mode_merge"}}</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer text-rose-600 dark:text-rose-400">
                        <input type="radio" name="replace" value="true" class="text-rose-600 focus:ring-rose-500">
                        <span>{{t .Lang "ports_import_mode_replace"}}</span>
                    </label>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-200 dark:border-slate-800">
                <button type="button" onclick="this.closest('.fixed').remove()"
                        class="px-3.5 py-1.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium transition text-xs">
                    {{t .Lang "cancel"}}
                </button>
                <button type="submit"
                        class="px-4 py-1.5 rounded bg-blue-600 hover:bg-blue-500 text-white font-medium transition shadow text-xs">
                    {{t .Lang "ports_import_btn"}}
                </button>
            </div>
        </form>
    </div>
</div>
