<div class="fixed inset-0 bg-black/60 dark:bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in" onclick="if(event.target===this) closeModal()">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl max-w-md w-full p-6 shadow-2xl space-y-4 text-slate-800 dark:text-slate-100">
        <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
            <h2 class="text-base font-bold text-slate-900 dark:text-white flex items-center space-x-2">
                <span>✏️</span>
                <span>{{t .Lang "edit_host_title"}} ({{.Host.IP}})</span>
            </h2>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-lg">&times;</button>
        </div>

        <form hx-post="/api/hosts/{{.Host.IP}}/update" hx-target="#main-content" hx-swap="outerHTML" onclick="if(event.submitter) closeModal()" class="space-y-4 text-xs">
            <div>
                <label class="block font-medium text-slate-700 dark:text-slate-300">{{t .Lang "edit_host_disp_label"}}</label>
                <input type="text" name="display_name" value="{{.Host.DisplayName}}" placeholder="{{.Host.Hostname}}"
                       class="w-full mt-1 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-3 py-2 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block font-medium text-slate-700 dark:text-slate-300">{{t .Lang "edit_host_vendor_label"}}</label>
                <input type="text" name="vendor_model" value="{{.Host.VendorModel}}" placeholder="{{t .Lang "edit_host_vendor_ph"}}"
                       class="w-full mt-1 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-3 py-2 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block font-medium text-slate-700 dark:text-slate-300">{{t .Lang "edit_host_ignored_ports_label"}}</label>
                <input type="text" name="ignored_ports" value="{{.Host.IgnoredPorts}}" placeholder="{{t .Lang "edit_host_ignored_ports_ph"}}"
                       class="w-full mt-1 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-3 py-2 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-blue-500 font-mono">
                <p class="text-[10px] text-slate-400 mt-1">{{t .Lang "edit_host_ignored_ports_help"}}</p>
            </div>

            <div class="flex items-center space-x-2 pt-1">
                <input type="checkbox" name="is_static_ip" id="edit_is_static_ip" value="true" {{if .Host.IsStaticIP}}checked{{end}}
                       class="rounded bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-blue-600 focus:ring-0">
                <label for="edit_is_static_ip" class="text-slate-700 dark:text-slate-300 font-medium cursor-pointer">{{t .Lang "edit_host_static_chk"}}</label>
            </div>

            <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-200 dark:border-slate-800">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium">
                    {{t .Lang "cancel"}}
                </button>
                <button type="submit" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium shadow">
                    {{t .Lang "save"}}
                </button>
            </div>
        </form>
    </div>
</div>
