<!-- Invisible Backdrop to close menu on outside click -->
<div class="fixed inset-0 z-40 bg-transparent" onclick="this.parentElement.innerHTML = ''"></div>

<div class="absolute right-0 top-full mt-1 w-56 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl py-1.5 z-50 text-left text-xs divide-y divide-slate-100 dark:divide-slate-800 animate-fade-in">
    <div class="py-1">
        <!-- Toggle Approval -->
        <button hx-post="/api/hosts/{{.Host.IP}}/toggle_approval" hx-target="#main-content" hx-swap="outerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-2 text-slate-800 dark:text-slate-200">
            <span>{{if .Host.IsApproved}}🔴 未承認に戻す{{else}}✅ 承認済みに変更{{end}}</span>
        </button>

        <!-- Toggle Protection -->
        <button hx-post="/api/hosts/{{.Host.IP}}/toggle_protection" hx-target="#main-content" hx-swap="outerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-2 text-slate-800 dark:text-slate-200">
            <span>{{if .Host.IsProtected}}📌 保護を解除{{else}}📌 自動削除から保護{{end}}</span>
        </button>
    </div>

    <!-- Uptime Kuma Monitoring Actions -->
    <div class="py-1">
        {{if not .Host.IsMonitored}}
        <button hx-post="/api/hosts/{{.Host.IP}}/kuma/start" hx-target="#main-content" hx-swap="outerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-2 text-emerald-600 dark:text-emerald-400">
            <span>▶ 監視開始 (Kuma)</span>
        </button>
        {{else}}
            {{if .Host.IsPaused}}
            <button hx-post="/api/hosts/{{.Host.IP}}/kuma/resume" hx-target="#main-content" hx-swap="outerHTML"
                    class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-2 text-emerald-600 dark:text-emerald-400">
                <span>▶ 監視再開</span>
            </button>
            {{else}}
            <button hx-post="/api/hosts/{{.Host.IP}}/kuma/pause" hx-target="#main-content" hx-swap="outerHTML"
                    class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-2 text-amber-600 dark:text-amber-400">
                <span>⏸️ 監視を一時停止</span>
            </button>
            {{end}}
        {{end}}
    </div>

    <!-- Edit Details -->
    <div class="py-1">
        <button hx-get="/modals/edit_host?ip={{.Host.IP}}" hx-target="#modal-container" hx-swap="innerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-2 text-slate-700 dark:text-slate-300">
            <span>✏️ ホスト情報・表示名を編集</span>
        </button>
    </div>

    <!-- Delete -->
    <div class="py-1">
        <button hx-delete="/api/hosts/{{.Host.IP}}" hx-confirm="ホスト {{.Host.IP}} を削除しますか？"
                hx-target="#main-content" hx-swap="outerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-red-50 dark:hover:bg-red-950/60 flex items-center space-x-2 text-red-600 dark:text-red-400">
            <span>🗑️ このホストを削除</span>
        </button>
    </div>
</div>
