<!-- Invisible Backdrop to close menu on outside click -->
<div class="fixed inset-0 z-40 bg-transparent" onclick="this.parentElement.innerHTML = ''"></div>

<div class="absolute right-0 top-full mt-1 w-56 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl py-1.5 z-50 text-left text-xs divide-y divide-slate-100 dark:divide-slate-800 animate-fade-in">
    <div class="py-1">
        <!-- Toggle Approval -->
        <button hx-post="/api/hosts/{{.Host.IP}}/toggle_approval?id={{.Host.ID}}" hx-target="#main-content" hx-swap="outerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-2 text-slate-800 dark:text-slate-200">
            <span>{{if .Host.IsApproved}}{{t $.Lang "action_mark_unapproved"}}{{else}}{{t $.Lang "action_mark_approved"}}{{end}}</span>
        </button>

        <!-- Toggle Protection -->
        <button hx-post="/api/hosts/{{.Host.IP}}/toggle_protection?id={{.Host.ID}}" hx-target="#main-content" hx-swap="outerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-2 text-slate-800 dark:text-slate-200">
            <span>{{if .Host.IsProtected}}{{t $.Lang "action_unprotect"}}{{else}}{{t $.Lang "action_protect"}}{{end}}</span>
        </button>

        <!-- Toggle DHCP -->
        <button hx-post="/api/hosts/{{.Host.IP}}/toggle_dhcp?id={{.Host.ID}}" hx-target="#main-content" hx-swap="outerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-2 text-slate-800 dark:text-slate-200">
            <span>{{if .Host.IsDHCP}}{{t $.Lang "action_toggle_dhcp_unmark"}}{{else}}{{t $.Lang "action_toggle_dhcp_mark"}}{{end}}</span>
        </button>
    </div>

    <!-- Edit Details & Full Scan -->
    <div class="py-1">
        <button hx-post="/api/hosts/{{.Host.IP}}/full_scan?id={{.Host.ID}}" hx-target="#main-content" hx-swap="outerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-amber-50 dark:hover:bg-amber-950/60 flex items-center space-x-2 text-amber-700 dark:text-amber-300">
            <span>{{t $.Lang "action_full_scan"}}</span>
        </button>
        <button hx-get="/modals/edit_host?id={{.Host.ID}}&ip={{.Host.IP}}" hx-target="#modal-container" hx-swap="innerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-2 text-slate-700 dark:text-slate-300">
            <span>{{t $.Lang "action_edit_host"}}</span>
        </button>
    </div>

    <!-- Delete -->
    <div class="py-1">
        <button hx-delete="/api/hosts/{{.Host.IP}}?id={{.Host.ID}}" hx-confirm="Delete host {{.Host.IP}}?"
                hx-target="#main-content" hx-swap="outerHTML"
                class="w-full text-left px-3 py-1.5 hover:bg-red-50 dark:hover:bg-red-950/60 flex items-center space-x-2 text-red-600 dark:text-red-400">
            <span>{{t $.Lang "action_delete_host"}}</span>
        </button>
    </div>
</div>
