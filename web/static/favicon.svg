<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="1.5" />

  <!-- Radar / Scan Wave from Router Core -->
  <circle cx="32" cy="21" r="14" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <circle cx="32" cy="21" r="9" fill="none" stroke="#bfdbfe" stroke-width="1.2" opacity="0.4" />

  <!-- Topology Link Lines -->
  <!-- Main Core to Left Host -->
  <path d="M32 21 L18 47" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- Main Core to Right Host -->
  <path d="M32 21 L46 47" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- Inter-host Subnet Connection -->
  <path d="M18 47 L46 47" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Center Gateway / Core Router Node -->
  <circle cx="32" cy="21" r="7" fill="#ffffff" filter="url(#glow)" />
  <circle cx="32" cy="21" r="3.5" fill="#2563eb" />

  <!-- Left Host Node (UP - Emerald Green) -->
  <circle cx="18" cy="47" r="5.5" fill="#ffffff" />
  <circle cx="18" cy="47" r="3" fill="#10b981" />

  <!-- Right Host Node (Active - Cyan) -->
  <circle cx="46" cy="47" r="5.5" fill="#ffffff" />
  <circle cx="46" cy="47" r="3" fill="#06b6d4" />
</svg>
