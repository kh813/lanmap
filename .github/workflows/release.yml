name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            pkg_name: lanmap-mac-arm64
            binary_name: lanmap
          - os: darwin
            arch: amd64
            pkg_name: lanmap-mac-x64
            binary_name: lanmap
          - os: linux
            arch: amd64
            pkg_name: lanmap-linux-x64
            binary_name: lanmap
          - os: linux
            arch: arm64
            pkg_name: lanmap-linux-arm64
            binary_name: lanmap
          - os: windows
            arch: amd64
            pkg_name: lanmap-win-x64
            binary_name: lanmap.exe
          - os: windows
            arch: arm64
            pkg_name: lanmap-win-arm64
            binary_name: lanmap.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract Version
        id: get_version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v0.0.2" >> $GITHUB_OUTPUT
          fi

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          go build -ldflags "-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }}" -o build/${{ matrix.binary_name }} ./cmd/lanmap

      - name: Package ZIP (Inner binary is lanmap)
        run: |
          mkdir -p dist
          (cd build && zip -q ../dist/${{ matrix.pkg_name }}.zip ${{ matrix.binary_name }})

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg_name }}
          path: dist/${{ matrix.pkg_name }}.zip

  publish-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
